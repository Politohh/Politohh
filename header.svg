<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Polito — video editor, vibe-coder, Call of Duty to Unreal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#05040c"/>
      <stop offset="0.65" stop-color="#0d0a1c"/>
      <stop offset="1" stop-color="#170f2e"/>
    </linearGradient>

    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f5af0" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="0.86" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7f5af0" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="streak2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5a0" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#00e5a0" stop-opacity="0.5"/>
      <stop offset="0.9" stop-color="#d7fff2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#00e5a0" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c4b5fd" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#00e5a0"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-80%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="240" fill="url(#bg)"/>

  <g filter="url(#soft)" opacity="0.16">
    <rect x="-900" y="-40" width="640" height="320" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="2400 0" dur="5.5s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect x="-900" y="-40" width="420" height="320" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="2600 0" dur="7.4s" begin="-3.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g filter="url(#glow)">
    <rect x="-1100" y="44" width="760" height="2" rx="1" fill="url(#streak)" opacity="0.55">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="2400 0" dur="1.9s" begin="-0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="-1100" y="72" width="520" height="2" rx="1" fill="url(#streak)" opacity="0.75">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="2400 0" dur="2.4s" begin="-1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="-1100" y="104" width="900" height="2.2" rx="1.1" fill="url(#streak2)" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="2400 0" dur="1.55s" begin="-0.75s" repeatCount="indefinite"/>
    </rect>
    <rect x="-1100" y="140" width="640" height="1.8" rx="0.9" fill="url(#streak)" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="2400 0" dur="2.1s" begin="-1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="-1100" y="176" width="1040" height="2" rx="1" fill="url(#streak)" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="2400 0" dur="1.7s" begin="-0.15s" repeatCount="indefinite"/>
    </rect>
    <rect x="-1100" y="206" width="700" height="1.6" rx="0.8" fill="url(#streak2)" opacity="0.45">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="2400 0" dur="2.6s" begin="-2.0s" repeatCount="indefinite"/>
    </rect>
  </g>

  <path d="M0,214 C300,190 620,232 900,210 C1040,198 1140,214 1200,204 L1200,240 L0,240 Z" fill="#ffffff" opacity="0.05"/>

  <text x="600" y="112" text-anchor="middle"
        font-family="Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif"
        font-size="78" font-weight="700" letter-spacing="8" fill="#ffffff">POLITO</text>

  <text x="600" y="152" text-anchor="middle"
        font-family="Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif"
        font-size="19" letter-spacing="1.5" fill="#9d97b8">video editor &#8226; vibe-coder &#8226; Call of Duty &#8594; Unreal</text>

  <rect x="500" y="174" width="200" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="2.4s" repeatCount="indefinite"/>
  </rect>
</svg>
